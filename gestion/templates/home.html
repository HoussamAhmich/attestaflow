<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Accueil</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
            background: white;
            padding: 50px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            margin-bottom: 20px;
        }

        p {
            color: #555;
            margin-bottom: 30px;
        }

        a {
            display: inline-block;
            margin: 10px;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
        }

        .login {
            background: #667eea;
        }

        .signup {
            background: #48bb78;
        }

        a:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>🎓 Gestion des Attestations</h1>
    <p>Bienvenue dans votre système intelligent</p>

    <a href="/login/" class="login">🔐 Se connecter</a>
    <a href="/register/" class="signup">📝 Créer un compte</a>
</div>

</body>
</html>
